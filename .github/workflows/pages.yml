name: Landing page

# Builds site/ (the landing page) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/engine/**"
      - "src/types.ts"
      - "src/presets.ts"
      - "public/**"
      - "vite.site.config.ts"
      - "package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Safety net while the Pages source is "Deploy from a branch": GitHub's branch builder
  # publishes the raw repo over the landing page on every push, so republish right after it.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4

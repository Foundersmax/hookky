name: docs probe
on:
  push:
    branches: [docs-probe]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://docs.freepik.com/llms.txt | grep -iE "/videos/|text-to-video|kling-v2-5|kling-v2.5|mystic|authentication|rate|limit|pricing|webhook" | head -60
          for p in videos/videos-api videos/get-one-video-by-id videos/download-an-option-video; do echo "=================== $p"; curl -sL "https://docs.freepik.com/api-reference/$p.md" | head -400; done

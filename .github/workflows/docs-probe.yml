name: docs probe
on:
  push:
    branches: [docs-probe]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://docs.magnific.com
          curl -sL $B/llms.txt | grep -iE "kling-v2.5-pro|kling-v2-5|wan-2-5-t2v|ltx-2-pro|seedance-2-5|mystic|get-all-videos|download-an-video|hailuo" | head -40
          for p in api-reference/videos/get-all-videos-by-order api-reference/videos/download-an-video ratelimits pricing; do echo "=================== $p"; curl -sL "$B/$p.md" | sed -n '1,700p'; done

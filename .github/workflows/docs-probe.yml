name: docs probe
on:
  push:
    branches: [docs-probe]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://docs.magnific.com
          curl -sL $B/llms.txt | grep -iE "option|kling-v2.5-pro|kling-v2-5-pro|wan-2-5-t2v|ltx-2-pro|seedance-2-5" | head -30
          for p in api-reference/videos/get-one-video-by-id api-reference/videos/download-an-option-video api-reference/image-to-video/kling-v2.5-pro/overview api-reference/text-to-video/ltx-2-pro api-reference/mystic/post-mystic; do echo "=================== $p"; curl -sL "$B/$p.md" | sed -n '1,900p'; done

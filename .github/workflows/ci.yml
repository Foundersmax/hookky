name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres for the accounts tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hookky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (cleaning, storyboard ops, director's notes, URL safety, accounts)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hookky_test
      - name: Build the app and the hosted page
        id: build
        # The hosted page is a single-file build; the normal (code-split) build runs last so dist/ is the app.
        run: |
          npm run build:artifact && npm run build
          echo "build=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - name: Install Chromium for the engine test
        run: npx playwright install --with-deps chromium
      - name: Engine smoke test (every template × format × background, plus fuzzing)
        run: npm run test:engine

  # Deploy to Render once the checks pass, through the service's deploy hook, then wait until
  # app.rookker.com serves this commit's build. Skipped until the RENDER_DEPLOY_HOOK_URL secret exists.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BUILD: ${{ needs.check.outputs.build }}
      APP: https://app.rookker.com/
    steps:
      - name: Trigger the Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::No RENDER_DEPLOY_HOOK_URL secret yet, so this push isn't deployed automatically. See the README (Deploy to Render)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Deploy requested for $BUILD"
      - name: Wait until the studio serves this build
        if: env.HOOK != ''
        run: |
          for i in $(seq 1 90); do
            # /api/health stays open behind sign-in and reports the commit (Render sets RENDER_GIT_COMMIT)
            # and the bundle it serves. The commit catches server-only changes too.
            health=$(curl -fsS -m 15 "${APP}api/health" 2>/dev/null || true)
            commit=$(echo "$health" | jq -r '.commit // empty' 2>/dev/null || true)
            live=$(echo "$health" | jq -r '.build // empty' 2>/dev/null || true)
            if [ -n "$commit" ]; then
              if [ "$commit" = "$GITHUB_SHA" ]; then echo "Live: $APP runs commit ${GITHUB_SHA:0:7} ($live)"; exit 0; fi
            elif [ "$live" = "$BUILD" ]; then echo "Live: $APP serves $BUILD"; exit 0; fi
            echo "  waiting (live: ${commit:0:7} ${live:-unreachable}, want: ${GITHUB_SHA:0:7} $BUILD)"; sleep 10
          done
          echo "::error::$APP still serves ${live:-nothing} after 15 minutes. Check the deploy in Render's Events tab."
          exit 1
